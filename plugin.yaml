name: better-weather
version: 0.9.2
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.1"
description: >
  Your agent's weather desk. Ask in plain words and get chat-ready answers from the official
  sources: conditions and forecasts, warnings matched to your exact spot (US, Canada, 38 European
  countries), Storm Prediction Center risk, radar and satellite pictures, plus how sure the
  forecast is, the forecasters' own reasoning, and which forecast has been right at your home.
  Warnings can be pushed to your chat without using the AI. Free public sources, no keys;
  macOS, Windows and Linux.
author: Jarret Coon
license: MIT
homepage: https://github.com/jarretcoon/better-weather
tags: [weather, forecast, alerts, severe-weather, radar, satellite, nws, noaa]
provides_tools:
  - weather
  - weather_forecast
  - weather_alerts
  - weather_severe
  - weather_places
  - weather_radar
  - weather_satellite
  - weather_air
  - weather_history
  - weather_confidence
  - weather_discussion
  - weather_best_time
  - weather_scorecard
  - weather_travel
  - weather_water
  - weather_science
provides_hooks: []
config_schema:
  home:
    type: str
    default: ""
    label: Home
    description: "Your home place: 'Des Moines, IA', a ZIP code, an airport code like KDSM, or 'lat,lon'."
  units:
    type: str
    choices: [us, metric]
    default: us
    label: Units
    description: "us = °F, mph, inches. metric = °C, km/h, mm."
  clock:
    type: str
    choices: [12h, 24h]
    default: 12h
    label: Clock
