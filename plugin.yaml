name: better-weather
version: 0.5.0
manifest_version: 2
api_version: 1
description: >
  Reliable weather for Hermes on macOS, Windows and Linux: current conditions, forecasts up to
  16 days, official alerts, severe-storm risk at your exact spot, radar and satellite pictures,
  air quality and weather history, plus zero-token warning pushes. Pure Python, no compiled
  dependencies, free keyless sources (NWS, Open-Meteo, Storm Prediction Center, NOAA GOES).
author: Jarret Coon
homepage: https://github.com/jarretcoon/better-weather
tags: [weather, forecast, alerts, severe-weather]
provides_tools:
  - weather
  - weather_forecast
  - weather_alerts
  - weather_severe
  - weather_places
  - weather_radar
  - weather_satellite
  - weather_air
  - weather_history
  - weather_confidence
  - weather_discussion
  - weather_best_time
  - weather_scorecard
  - weather_travel
  - weather_water
  - weather_science
provides_hooks: []
config_schema:
  home:
    type: str
    default: ""
    label: Home
    description: "Your home place: 'Des Moines, IA', a ZIP code, an airport code like KDSM, or 'lat,lon'."
  units:
    type: str
    choices: [us, metric]
    default: us
    label: Units
    description: "us = °F, mph, inches. metric = °C, km/h, mm."
  clock:
    type: str
    choices: [12h, 24h]
    default: 12h
    label: Clock
