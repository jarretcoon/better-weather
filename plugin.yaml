name: better-weather
version: 0.1.0
manifest_version: 2
api_version: 1
description: >
  Reliable weather for Hermes on macOS, Windows and Linux: current conditions, forecasts up to
  16 days, official alerts and severe-storm risk at your exact spot. Pure Python, no compiled
  dependencies, free keyless sources (NWS, Open-Meteo, Storm Prediction Center).
author: Jarret Coon
homepage: https://github.com/jarretcoon/better-weather
tags: [weather, forecast, alerts, severe-weather]
provides_tools:
  - weather
  - weather_forecast
  - weather_alerts
  - weather_severe
  - weather_places
provides_hooks: []
config_schema:
  home:
    type: str
    default: ""
    label: Home
    description: "Your home place: 'Des Moines, IA', a ZIP code, an airport code like KDSM, or 'lat,lon'."
  units:
    type: str
    choices: [us, metric]
    default: us
    label: Units
    description: "us = °F, mph, inches. metric = °C, km/h, mm."
  clock:
    type: str
    choices: [12h, 24h]
    default: 12h
    label: Clock
