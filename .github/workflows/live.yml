name: Live sources

# Calls the real weather services once a day, so a changed or broken source shows up here
# before it shows up in a chat.
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "httpx>=0.27,<1" "numpy>=1.26,<3" "pytest>=8,<10"
      - run: python -m pytest tests -m live
