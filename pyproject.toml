[project]
name = "better-weather"
version = "0.2.1"
description = "Reliable, cross-platform weather plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11"
# Both are already in Hermes' own environment; declared so the plugin never depends on that by accident.
dependencies = [
    "httpx>=0.27,<1",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # weather text legitimately uses °, – and ·

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["__init__.py", "core"]
reportMissingModuleSource = false
